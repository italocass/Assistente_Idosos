<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Visual para Idosos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <style>
        /* Design de alto contraste para acessibilidade */
        body { 
            background-color: #121212; 
            color: #FFD700; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 15px; 
            overflow-x: hidden; /* Evita rolagem horizontal no celular */
        }
        h1 { font-size: 2em; margin-bottom: 5px; }
        #instrucao { font-size: 1.2em; color: #FFFFFF; margin-bottom: 15px; }
        
        /* Área de resultado destacada e com fonte grande */
        #resultado { 
            font-size: 1.5em; 
            margin: 10px auto; 
            font-weight: bold; 
            background: #333333; 
            padding: 15px; 
            border-radius: 10px; 
            width: 90%;
            max-width: 400px;
        }
        
        /* Estilização da área da câmera */
        canvas { 
            border: 4px solid #FFD700; 
            border-radius: 10px; 
            margin-top: 10px; 
            max-width: 100%; 
            height: auto; /* Mantém a proporção correta no ecrã */
        }
    </style>
</head>
<body>

    <h1>Assistente Visual</h1>
    <p id="instrucao">Aponte a câmera para um objeto</p>
    
    <div id="resultado">Iniciando Inteligência Artificial...</div>

    <script>
        let video;
        let detector;
        let deteccoes = [];

        // Função de configuração inicial (roda uma vez)
        function setup() {
            // Criando o canvas com um tamanho que se adapte melhor ao celular (320x480)
            let canvas = createCanvas(320, 480);
            canvas.parent(document.body);
            
            // Configuração específica para mobile: forçar a câmera traseira
            let constraints = {
                video: {
                    facingMode: "environment" // "user" seria a câmera frontal
                },
                audio: false
            };
            
            // Inicializa a webcam com as configurações de celular
            video = createCapture(constraints);
            
            // Essa linha é OBRIGATÓRIA para a câmera funcionar no iPhone/Safari e não abrir em tela cheia
            video.elt.setAttribute('playsinline', '');
            
            video.size(320, 480);
            video.hide(); // Esconde o vídeo HTML nativo para desenhar no nosso Canvas
            
            // Carrega o modelo de Machine Learning COCO-SSD
            detector = ml5.objectDetector('cocossd', modelReady);
        }

        // Função chamada quando o modelo de IA termina de carregar
        function modelReady() {
            document.getElementById('resultado').innerText = "Sistema Pronto!";
            detectar(); // Inicia o loop de detecção contínua
        }

        // Função que processa os frames do vídeo e classifica os objetos
        function detectar() {
            detector.detect(video, function(error, results) {
                if (error) { 
                    console.error(error); 
                    return; 
                }
                
                deteccoes = results;
                
                if (deteccoes.length > 0) {
                    // Seleciona o objeto detectado com maior nível de acurácia (confidence)
                    let objetoPrincipal = deteccoes[0].label;
                    let confianca = (deteccoes[0].confidence * 100).toFixed(0);
                    
                    document.getElementById('resultado').innerText = `Vejo: ${objetoPrincipal.toUpperCase()} (${confianca}% de certeza)`;
                } else {
                    document.getElementById('resultado').innerText = "Procurando objetos...";
                }
                
                detectar(); // Loop contínuo para atualizar em tempo real
            });
        }

        // Função de desenho para renderizar a câmera e as caixas delimitadoras
        function draw() {
            // Desenha o vídeo ocupando o tamanho total do canvas
            image(video, 0, 0, width, height); 
            
            for (let i = 0; i < deteccoes.length; i++) {
                let objeto = deteccoes[i];
                
                // Desenha a caixa ao redor do objeto
                stroke(255, 215, 0); // Amarelo
                strokeWeight(4);
                noFill();
                rect(objeto.x, objeto.y, objeto.width, objeto.height);
                
                // Escreve o nome do objeto (label) acima da caixa
                noStroke();
                fill(255, 215, 0);
                textSize(20);
                text(objeto.label, objeto.x + 5, objeto.y + 20);
            }
        }
    </script>
</body>
</html>
