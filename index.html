<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Visual para Idosos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <style>
        body { 
            background-color: #121212; 
            color: #FFD700; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 15px; 
            overflow-x: hidden; 
        }
        h1 { font-size: 2em; margin-bottom: 5px; }
        #instrucao { font-size: 1.2em; color: #FFFFFF; margin-bottom: 15px; }
        
        #resultado { 
            font-size: 1.5em; 
            margin: 10px auto; 
            font-weight: bold; 
            background: #333333; 
            padding: 15px; 
            border-radius: 10px; 
            width: 90%;
            max-width: 400px;
        }
        
        canvas { 
            border: 4px solid #FFD700; 
            border-radius: 10px; 
            margin-top: 10px; 
            max-width: 100%; 
            height: auto; 
            display: none; 
        }

        button { 
            background-color: #FFD700; 
            color: #121212; 
            font-size: 1.5em; 
            font-weight: bold; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 10px; 
            margin-top: 20px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h1>Assistente Visual</h1>
    <p id="instrucao">Aperte o botão para começar</p>
    
    <button id="btnLigar" onclick="iniciarSistema()">Ligar Câmera</button>
    <div id="resultado" style="display: none;">Aguardando permissão...</div>

    <video id="videoNativo" width="320" height="480" autoplay playsinline muted style="display: none;"></video>

    <script>
        let detector;
        let deteccoes = [];
        let sistemaIniciado = false;
        let videoElement;

        function setup() {
            let canvas = createCanvas(320, 480);
            canvas.parent(document.body);
            canvas.id('meuCanvas'); 
            videoElement = document.getElementById('videoNativo');
        }

        async function iniciarSistema() {
            document.getElementById('btnLigar').style.display = 'none'; 
            document.getElementById('resultado').style.display = 'block'; 
            document.getElementById('resultado').innerText = "Solicitando permissão da câmera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    
                    // CORREÇÃO 2: Reforço as dimensões no JavaScript antes de chamar a IA
                    videoElement.width = 320;
                    videoElement.height = 480;
                    
                    document.getElementById('resultado').innerText = "Carregando IA... (Pode demorar uns segundos)";
                    document.getElementById('meuCanvas').style.display = 'inline'; 
                    
                    // CORREÇÃO 3: Passamos o vídeo DIRETAMENTE na inicialização para a IA não se perder
                    detector = ml5.objectDetector('cocossd', videoElement, modelReady);
                    sistemaIniciado = true;
                };

            } catch (erro) {
                document.getElementById('resultado').innerText = "Erro: " + erro.message;
                console.error(erro);
            }
        }

        function modelReady() {
            document.getElementById('resultado').innerText = "Sistema Pronto! Aponte para um objeto.";
            detectar(); 
        }

        function detectar() {
            detector.detect(videoElement, function(error, results) {
                if (error) { console.error(error); return; }
                deteccoes = results;
                
                if (deteccoes.length > 0) {
                    let objetoPrincipal = deteccoes[0].label;
                    let confianca = (deteccoes[0].confidence * 100).toFixed(0);
                    document.getElementById('resultado').innerText = `Vejo: ${objetoPrincipal.toUpperCase()} (${confianca}% de certeza)`;
                } else {
                    document.getElementById('resultado').innerText = "Procurando objetos...";
                }
                detectar(); 
            });
        }

        function draw() {
            if(sistemaIniciado) {
                image(videoElement, 0, 0, width, height); 
                
                for (let i = 0; i < deteccoes.length; i++) {
                    let objeto = deteccoes[i];
                    stroke(255, 215, 0); 
                    strokeWeight(4);
                    noFill();
                    rect(objeto.x, objeto.y, objeto.width, objeto.height);
                    noStroke();
                    fill(255, 215, 0);
                    textSize(20);
                    text(objeto.label, objeto.x + 5, objeto.y + 20);
                }
            }
        }
    </script>
</body>
</html>
