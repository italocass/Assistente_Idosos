<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Visual para Idosos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <style>
        body { 
            background-color: #121212; 
            color: #FFD700; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 15px; 
            overflow-x: hidden; 
        }
        h1 { font-size: 2em; margin-bottom: 5px; }
        #instrucao { font-size: 1.2em; color: #FFFFFF; margin-bottom: 15px; }
        
        #resultado { 
            font-size: 1.5em; 
            margin: 10px auto; 
            font-weight: bold; 
            background: #333333; 
            padding: 15px; 
            border-radius: 10px; 
            width: 90%;
            max-width: 400px;
        }
        
        canvas { 
            border: 4px solid #FFD700; 
            border-radius: 10px; 
            margin-top: 10px; 
            max-width: 100%; 
            height: auto; 
            display: none; 
        }

        button { 
            background-color: #FFD700; 
            color: #121212; 
            font-size: 1.5em; 
            font-weight: bold; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 10px; 
            margin-top: 20px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h1>Assistente Visual</h1>
    <p id="instrucao">Aperte o botão para começar</p>
    
    <button id="btnLigar" onclick="iniciarSistema()">Ligar Câmera</button>
    <div id="resultado" style="display: none;">Aguardando permissão...</div>

    <video id="videoNativo" width="320" height="480" autoplay playsinline muted style="display: none;"></video>

    <script>
        let detector;
        let deteccoes = [];
        let sistemaIniciado = false;
        let videoElement;
        
        // Variáveis de controle para a voz não ficar repetitiva
        let ultimoObjetoFalado = "";
        let tempoUltimaFala = 0;

        // Dicionário completo de tradução da Inteligência Artificial
        const dicionario = {
            "person": "pessoa", "bicycle": "bicicleta", "car": "carro", "motorcycle": "moto",
            "airplane": "avião", "bus": "ônibus", "train": "trem", "truck": "caminhão",
            "boat": "barco", "traffic light": "semáforo", "fire hydrant": "hidrante",
            "stop sign": "placa de pare", "parking meter": "parquímetro", "bench": "banco",
            "bird": "pássaro", "cat": "gato", "dog": "cachorro", "horse": "cavalo",
            "sheep": "ovelha", "cow": "vaca", "elephant": "elefante", "bear": "urso",
            "zebra": "zebra", "giraffe": "girafa", "backpack": "mochila", "umbrella": "guarda-chuva",
            "handbag": "bolsa", "tie": "gravata", "suitcase": "mala", "frisbee": "frisbee",
            "skis": "esquis", "snowboard": "snowboard", "sports ball": "bola",
            "kite": "pipa", "baseball bat": "taco", "baseball glove": "luva",
            "skateboard": "skate", "surfboard": "prancha de surfe", "tennis racket": "raquete",
            "bottle": "garrafa", "wine glass": "taça", "cup": "copo", "fork": "garfo",
            "knife": "faca", "spoon": "colher", "bowl": "tigela", "banana": "banana",
            "apple": "maçã", "sandwich": "sanduíche", "orange": "laranja", "broccoli": "brócolis",
            "carrot": "cenoura", "hot dog": "cachorro-quente", "pizza": "pizza", "donut": "donut",
            "cake": "bolo", "chair": "cadeira", "couch": "sofá", "potted plant": "planta",
            "bed": "cama", "dining table": "mesa", "toilet": "vaso sanitário",
            "tv": "televisão", "laptop": "notebook", "mouse": "mouse", "remote": "controle remoto",
            "keyboard": "teclado", "cell phone": "celular", "microwave": "micro-ondas",
            "oven": "forno", "toaster": "torradeira", "sink": "pia", "refrigerator": "geladeira",
            "book": "livro", "clock": "relógio", "vase": "vaso", "scissors": "tesoura",
            "teddy bear": "urso de pelúcia", "hair drier": "secador de cabelo", "toothbrush": "escova de dentes"
        };

        function setup() {
            let canvas = createCanvas(320, 480);
            canvas.parent(document.body);
            canvas.id('meuCanvas'); 
            videoElement = document.getElementById('videoNativo');
        }

        // Função responsável por fazer o celular falar
        function falar(texto) {
            if ('speechSynthesis' in window && !window.speechSynthesis.speaking) {
                let mensagem = new SpeechSynthesisUtterance(texto);
                mensagem.lang = 'pt-BR'; // Força sotaque brasileiro
                mensagem.rate = 0.9;     // Deixa a voz ligeiramente mais devagar para o idoso
                window.speechSynthesis.speak(mensagem);
            }
        }

        async function iniciarSistema() {
            document.getElementById('btnLigar').style.display = 'none'; 
            document.getElementById('resultado').style.display = 'block'; 
            document.getElementById('resultado').innerText = "Solicitando permissão...";

            // Macete da Apple: A primeira fala PRECISA acontecer logo após o clique do botão
            // para "destrancar" o áudio no Safari.
            falar("Iniciando assistente");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    videoElement.width = 320;
                    videoElement.height = 480;
                    
                    document.getElementById('resultado').innerText = "Carregando Inteligência Artificial...";
                    document.getElementById('meuCanvas').style.display = 'inline'; 
                    
                    detector = ml5.objectDetector('cocossd', videoElement, modelReady);
                    sistemaIniciado = true;
                };

            } catch (erro) {
                document.getElementById('resultado').innerText = "Erro: " + erro.message;
            }
        }

        function modelReady() {
            document.getElementById('resultado').innerText = "Pronto! Aponte para algo.";
            detectar(); 
        }

        function detectar() {
            detector.detect(videoElement, function(error, results) {
                if (error) { return; }
                deteccoes = results;
                
                if (deteccoes.length > 0) {
                    let nomeOriginal = deteccoes[0].label;
                    let confianca = (deteccoes[0].confidence * 100).toFixed(0);
                    
                    // Busca a tradução no dicionário. Se não achar, usa o original em inglês
                    let nomeTraduzido = dicionario[nomeOriginal] || nomeOriginal;

                    document.getElementById('resultado').innerText = `Vejo: ${nomeTraduzido.toUpperCase()} (${confianca}%)`;

                    // Lógica para falar o objeto identificado
                    let agora = Date.now();
                    // Só fala se for um objeto diferente, ou se já passaram 4 segundos (4000 ms)
                    if (nomeTraduzido !== ultimoObjetoFalado || (agora - tempoUltimaFala > 4000)) {
                        falar(nomeTraduzido);
                        ultimoObjetoFalado = nomeTraduzido;
                        tempoUltimaFala = agora;
                    }

                } else {
                    document.getElementById('resultado').innerText = "Procurando...";
                }
                detectar(); 
            });
        }

        function draw() {
            if(sistemaIniciado) {
                image(videoElement, 0, 0, width, height); 
                
                for (let i = 0; i < deteccoes.length; i++) {
                    let objeto = deteccoes[i];
                    let nomeOriginal = objeto.label;
                    let nomeTraduzido = dicionario[nomeOriginal] || nomeOriginal;

                    stroke(255, 215, 0); 
                    strokeWeight(4);
                    noFill();
                    rect(objeto.x, objeto.y, objeto.width, objeto.height);
                    noStroke();
                    fill(255, 215, 0);
                    textSize(20);
                    // Desenha o nome traduzido no vídeo
                    text(nomeTraduzido, objeto.x + 5, objeto.y + 20);
                }
            }
        }
    </script>
</body>
</html>
